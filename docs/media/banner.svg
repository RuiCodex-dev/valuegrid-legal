<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5c5953"/><stop offset="1" stop-color="#2e2c29"/></linearGradient>
<linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9c5bb"/><stop offset="1" stop-color="#9e9a91"/></linearGradient>
<radialGradient id="sphere" cx=".34" cy=".3" r=".8"><stop offset="0" stop-color="#fbfaf6"/><stop offset=".45" stop-color="#bdb9b0"/><stop offset=".8" stop-color="#5d5a54"/><stop offset="1" stop-color="#3b3935"/></radialGradient>
<linearGradient id="vase" x1="0" x2="1"><stop offset="0" stop-color="#7d7a73"/><stop offset=".28" stop-color="#e9e6de"/><stop offset=".6" stop-color="#5e5b55"/><stop offset="1" stop-color="#25231f"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
<clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath>
