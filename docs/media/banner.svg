</defs>
<style>
.gl{stroke:#8ab4f8;stroke-opacity:0;stroke-width:1;animation:gl .6s ease-out forwards}
@keyframes gl{to{stroke-opacity:.7}}
.vs{opacity:0;animation:pop .4s ease-out forwards}
@keyframes pop{from{opacity:0}to{opacity:1}}
.wipe{animation:wipe 9s cubic-bezier(.65,0,.35,1) 1.2s infinite}
@keyframes wipe{0%,12%{transform:translateX(0)}38%,62%{transform:translateX(300px)}88%,100%{transform:translateX(600px)}}
.edge{animation:edge 9s cubic-bezier(.65,0,.35,1) 1.2s infinite}
@keyframes edge{0%,12%{transform:translateX(0);opacity:0}14%{opacity:1}38%,62%{transform:translateX(300px);opacity:1}86%{opacity:1}88%,100%{transform:translateX(600px);opacity:0}}
.probe{animation:probe 6s ease-in-out infinite alternate}
@keyframes probe{0%{transform:translateY(0)}100%{transform:translateY(196px)}}
.rv{opacity:0;animation:rv .9s cubic-bezier(.2,.7,.2,1) forwards}.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.shine{animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-300px)}50%,100%{transform:translateX(720px)}}
.drift{animation:dr 10s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(36px,12px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}.gl{stroke-opacity:.7}}
</style>
